[project]
name = "dtv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.12.0",
    "pytest>=9.0.2",
    "torch>=2.9.1",
    "transformers>=4.57.3",
    "tree-sitter>=0.25.2",
    "tree-sitter-language-pack>=0.13.0",
    ]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
